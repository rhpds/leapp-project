---
- name: Extend partition and resize physical volume
  hosts: "{{ rhel_inventory_group | default(omit) }}"
  strategy: free
  gather_facts: false
  become: true
  vars:
    perform_resize: false
  tasks:
    # NOTE: community.general modules (parted/lvol) are avoided on purpose.
    # Recent community.general releases use Python 3.7+ syntax (f-strings,
    # `from __future__ import annotations`) which fails on the RHEL 7 (py2.7)
    # and RHEL 8 (py3.6) workshop nodes. ansible.builtin + CLI tools work on
    # every target Python, so we shell out to parted/growpart/pvresize.
    - name: "Determine last partition number on {{ full_storage_device_name }}"
      ansible.builtin.shell: >-
        set -o pipefail;
        parted -m -s {{ full_storage_device_name }} unit MiB print
        | grep -E '^[0-9]+:' | tail -n1 | cut -d: -f1
      args:
        executable: /bin/bash
      register: last_partition
      changed_when: false

    - name: "{{ full_storage_device_name }} last partition number"
      ansible.builtin.debug:
        var: last_partition.stdout

    - name: Package cloud-utils-growpart installed
      ansible.builtin.package:
        name: cloud-utils-growpart
        state: present

    - name: Extend existing partition to fill all available space on device
      ansible.builtin.command: >-
        growpart {{ full_storage_device_name }} {{ last_partition.stdout | trim }}
      when: perform_resize | bool
      register: growpart_output
      changed_when: "'CHANGED' in growpart_output.stdout"
      # growpart exits non-zero with NOCHANGE when the partition already fills
      # the disk (e.g. cloud-init grew it at boot); that is not a failure.
      failed_when:
        - growpart_output.rc != 0
        - "'NOCHANGE' not in (growpart_output.stdout ~ growpart_output.stderr)"

    - name: Resize physical volume to utilize all available space
      ansible.builtin.command: >-
        pvresize {{ full_storage_device_name }}{{ last_partition.stdout | trim }}
      when: perform_resize | bool
      register: pvresize_output
      changed_when: "'successfully resized' in pvresize_output.stdout"

    - name: Confirm physical volume resize completed
      ansible.builtin.debug:
        msg: >-
          Resized {{ full_storage_device_name }} partition
          {{ last_partition.stdout | trim }} and physical volume
          {{ full_storage_device_name }}{{ last_partition.stdout | trim }}.
      when:
        - perform_resize | bool
        - pvresize_output is not skipped
...
